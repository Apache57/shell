# Fork-only CI: enforce the compositor seam (see AGENTS.md §3 rule 1).
# Named `niri-*` so it never collides with an upstream workflow on merge.
name: niri · no new Hyprland imports

on:
  pull_request:
  push:
    branches: ["**"]

jobs:
  no-new-hyprland-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for new direct Quickshell.Hyprland imports
        run: bash scripts/niri/check-no-new-hyprland-imports.sh
